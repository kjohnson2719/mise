name: Release

# A release of Merran (docs/operations.md, "Releases and updates"), run by
# hand from main with its version: every check, then the Docker image for
# amd64 and arm64, signed, with its SBOM and provenance; the browser
# extension's zips; and the GitHub release, tagged v<version>, with notes
# from the commits since the last one.
#
# Image tags: the version itself (0.1.0-alpha.1, 0.4.2), which never moves,
# and `next`, the newest release of any kind. A release that isn't a
# pre-release also moves 0.4 and `latest` (and 1, from 1.0 on).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, without a v: 0.1.0-alpha.1, or 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      stable-major: ${{ steps.version.outputs.stable-major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION isn't a version like 0.1.0-alpha.1 or 0.1.0."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is released already."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # A major-version tag (1, 2) only from 1.0 on, and only for releases.
          if [[ "$VERSION" != *-* && "$VERSION" != 0.* ]]; then
            echo "stable-major=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable-major=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    uses: ./.github/workflows/check.yml

  image:
    name: Docker image
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For cosign's keyless signing, with GitHub's identity for this run.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=next
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ needs.version.outputs.stable-major == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: MERRAN_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signed by digest, so every tag of it is covered: anyone can check it
      # was built here, by this workflow, from this repo.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"

  extension:
    name: Browser extension
    needs: [version, check]
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The release's version: WXT gives the browsers its numbers (0.1.0),
      # and Chrome shows the rest (0.1.0-alpha.1).
      - run: npm pkg set version="$VERSION"
        working-directory: apps/extension
      - run: pnpm --filter @merran/extension zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: apps/extension/.output/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, image, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: extension
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Getting it

          \`\`\`bash
          docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION}
          \`\`\`

          With the compose file in the repo, \`docker compose pull && docker compose up -d\`. The browser extension's zips are below: load the one for your browser as an unpacked extension (see apps/extension/README.md).

          The image is signed: \`cosign verify ghcr.io/${GITHUB_REPOSITORY}:${VERSION} --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`
          EOF
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" extension/*.zip \
            --target "$GITHUB_SHA" \
            --title "Merran $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
